name: Build Windows exe

# Builds an unsigned Windows installer without the signing, R2 and update-feed
# secrets that release-desktop.yml needs. Every run uploads the installer as a
# workflow artifact; pushing a `win-v*` tag also attaches it to a GitHub release.

on:
  push:
    branches:
      - main
    tags:
      - "win-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # electron-builder expands this into app-update.yml and fails when it is unset.
      # Without a configured feed, point the updater at this repository's latest release.
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL || format('https://github.com/{0}/releases/latest/download', github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prepare:desktop-runtime win32-x64
        env:
          PUBLISH_API_URL: ${{ vars.PUBLISH_API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - run: bun run build:desktop-app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - name: Build Windows package
        run: bun --bun node_modules/electron-builder/cli.js --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyGame-Windows-x64-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release:
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OhMyGame-Windows-x64-${{ github.sha }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh needs to be told the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "OhMyGame $GITHUB_REF_NAME (Windows)" \
              --generate-notes
          fi
